# The app is hosted on Vercel at trainer.kiwistats.com. GitHub Pages only serves a
# forwarding page so old tinker-tanker.github.io/scorebox-trainer links keep working.
name: GitHub Pages redirect

on:
  push:
    branches: [main]
    paths: [redirect/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare redirect site
        run: |
          mkdir -p _redirect
          cp redirect/index.html _redirect/index.html
          cp redirect/index.html _redirect/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _redirect
      - id: deployment
        uses: actions/deploy-pages@v4
